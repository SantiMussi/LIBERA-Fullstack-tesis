# Perfil "mysql": usa una base MySQL 8 local en vez de H2.
# Antes de arrancar, ejecutar db/schema.sql y después db/seed.sql en MySQL Workbench.
spring.datasource.url=jdbc:mysql://localhost:3306/libera_db?serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Usamos 'validate': las tablas se crean con db/schema.sql y Spring solo verifica
# que el código Java coincida con la base de datos sin intentar sobreescribirla.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never
