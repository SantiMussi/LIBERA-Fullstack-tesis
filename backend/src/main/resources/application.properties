spring.application.name=backend

# Base de datos por defecto: H2 en memoria (modo MySQL). No hay que instalar nada:
# Hibernate crea las tablas a partir de las entidades y se cargan los datos de db/seed.sql.
# Los datos se reinician cada vez que se levanta el backend.
# Para usar MySQL en vez de H2, arrancar con el perfil "mysql" (ver application-mysql.properties).
# El schema "libera_db" existe para que el "USE libera_db;" de seed.sql funcione igual que en MySQL.
spring.datasource.url=jdbc:h2:mem:libera_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS libera_db\\;SET SCHEMA libera_db
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=embedded
spring.sql.init.data-locations=classpath:db/seed.sql
spring.jpa.defer-datasource-initialization=true

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Las entidades se convierten a DTO dentro de los servicios: no hace falta la sesión abierta en la vista
spring.jpa.open-in-view=false

# --- LIBERA ---
# Clave para firmar los JWT (mínimo 32 caracteres). En producción, definirla con la variable de entorno LIBERA_JWT_SECRET.
libera.security.jwt.secret=${LIBERA_JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
libera.security.jwt.expiration=24h
# API Key que los PMS de los hoteles mandan en el header X-API-KEY del webhook de check-in
libera.webhook.api-key=${LIBERA_WEBHOOK_API_KEY:libera-pms-secure-key-2026}
# Orígenes del front habilitados por CORS (separados por coma, admite comodines de puerto)
libera.cors.allowed-origins=${LIBERA_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
