spring.application.name=backend

# Los tests usan una base H2 en memoria (modo MySQL) para no depender de la base local.
# Hibernate crea el esquema a partir de las entidades en cada corrida.
spring.datasource.url=jdbc:h2:mem:libera_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

libera.security.jwt.secret=test-secret-for-jwt-signing-at-least-32-bytes
libera.security.jwt.expiration=1h
libera.webhook.api-key=libera-pms-secure-key-2026
libera.cors.allowed-origins=http://localhost:*
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
